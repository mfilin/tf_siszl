services:
  api:
    build:
      context: ./backend/TfSiszl.Api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      Database__Server: ${TF_SISZL_DB_SERVER:-host.docker.internal,1433}
      Database__Name: ${TF_SISZL_DB_NAME:-TF_SISZL}
      Database__User: ${TF_SISZL_DB_USER:-sa}
      Database__Password: ${TF_SISZL_DB_PASSWORD:?Set TF_SISZL_DB_PASSWORD in the environment}
      Database__RegionCode: ${TF_SISZL_REGION_CODE:-34}
      Cors__AllowedOrigins__0: http://localhost:8080
      Cors__AllowedOrigins__1: http://127.0.0.1:8080
    ports:
      - "5080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
